<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lernbegleiter</title>
  <meta name="description" content="Dein Schultag auf einen Blick: Stundenplan, Hausaufgaben, Termine und XP.">
  <meta name="theme-color" content="#0c0a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lernbegleiter">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <svg class="svgdefs" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient>
    <linearGradient id="brandgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient>
  </defs></svg>
  <header class="topbar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="url(#brandgrad)"/><rect x="7" y="9" width="16" height="12" rx="4" fill="#1b1030"/><circle cx="12" cy="15" r="1.8" fill="#ffc247"/><circle cx="18" cy="15" r="1.8" fill="#ffc247"/></svg>
      <span>Lernbegleiter</span>
    </div>
    <nav class="tabs" aria-label="Hauptnavigation">
      <button data-go="today"><span aria-hidden="true">⚡</span><b>Heute</b></button>
      <button data-go="homework"><span aria-hidden="true">📝</span><b>Aufgaben</b></button>
      <button data-go="events"><span aria-hidden="true">📅</span><b>Termine</b></button>
      <button data-go="plan"><span aria-hidden="true">🗓️</span><b>Plan</b></button>
      <button data-go="me"><span aria-hidden="true">🤖</span><b>Ich</b></button>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <script src="quotes.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
