<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lernbegleiter</title>
  <meta name="description" content="Dein Schultag auf einen Blick: Stundenplan, Ranzen, Hausaufgaben, Termine, XP und Rätsel.">
  <meta name="theme-color" content="#080a17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lernbegleiter">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="13" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="12.5" r="1.8" fill="currentColor"/><circle cx="15" cy="12.5" r="1.8" fill="currentColor"/><path d="M12 6V2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Lernbegleiter</span>
    </div>
    <button class="xp-pill" id="xp-pill" data-go="me" aria-label="Fortschritt anzeigen"></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <button data-go="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg><span>Heute</span></button>
    <button data-go="homework"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5l2 2 3.5-3.5M4 13.5l2 2 3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 7h7M13 14h7M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Aufgaben</span></button>
    <button data-go="events"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15.5" cy="15" r="1.6" fill="currentColor"/></svg><span>Termine</span></button>
    <button data-go="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M3.5 15h17M9.5 4v16" stroke="currentColor" stroke-width="1.5"/></svg><span>Plan</span></button>
    <button data-go="me"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9.5" cy="13" r="1.6" fill="currentColor"/><circle cx="14.5" cy="13" r="1.6" fill="currentColor"/><path d="M12 7V3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Ich</span></button>
  </nav>

  <div id="focus" class="focus" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <script src="quotes.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
